server.port=8080
app.mail-from=${MAIL_FROM:}
app.cors-origin=${CORS_ORIGIN:http://localhost:5173}
app.openai-api-key=${OPENAI_API_KEY:}
app.openai-model=${OPENAI_MODEL:gpt-5.4-mini}
app.openai-url=${OPENAI_API_URL:https://api.openai.com/v1/responses}
spring.mail.host=${SMTP_HOST:}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:true}
spring.datasource.url=${DATABASE_URL:jdbc:h2:file:D:/MartinQuest/data/martinquest;CIPHER=AES}
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=${DATABASE_USERNAME:sa}
spring.datasource.password=${DATABASE_FILE_PASSWORD:} ${DATABASE_USER_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
app.drive-staging-url=${DRIVE_STAGING_URL:}
app.drive-sync-token=${DRIVE_SYNC_TOKEN:}

name: Deploy Martin Quest to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Test combat and weapon grip rules
        run: node --test frontend/src/combat/rules.test.mjs frontend/src/art/weapons.test.mjs

      - name: Build
        run: npm run build

      - name: Check published character names and assets
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFileSync, existsSync } from 'node:fs';
          const html = readFileSync('dist/index.html', 'utf8');
          const bundle = html.match(/src="\/Martin95AM\/(assets\/[^" ]+\.js)"/);
          assert.ok(bundle, 'Built entry script must exist');
          const code = readFileSync(`dist/${bundle[1]}`, 'utf8');
          for (const name of ['Sensei', 'Técnico']) {
            assert.ok(code.includes(`Pulsa E para hablar con ${name}`), `Missing ${name}`);
          }
          assert.ok(code.includes('Kamas'), 'Missing kamas in the published game');
          assert.ok(!code.includes('Pulsa E para hablar con Elias'), 'Old character name');
          for (const asset of ['tiles/dojo.png', 'tiles/studio.png', 'player/guard.png', 'player/martin.png',
            'character-art/martin.png', 'character-art/martin-studio.png',
            'character-art/martin-studio-headphones.png', 'character-art/sensei.png',
            'character-art/technician.png', 'character-art/student.png']) {
            assert.ok(existsSync(`dist/assets/${asset}`), `Missing ${asset}`);
          }
          NODE

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
